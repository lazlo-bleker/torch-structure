name: Tests

on:
  - push
  - pull_request

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: |
          uv venv --python 3.12
          uv pip install torch

          $url = uv run python -c "import torch; v=torch.__version__.split('+')[0]; cuda=('cu'+torch.version.cuda.replace('.','')) if torch.version.cuda else 'cpu'; print(f'https://data.pyg.org/whl/torch-{v}+{cuda}.html')"
          echo \"Using PyG wheel index: $url\"
          uv pip install torch-scatter -f $url
          
          uv pip install torch_geometric
          uv pip install -e .[dev]

      - name: Run tests
        run: |
          uv run pytest