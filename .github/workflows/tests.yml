name: Tests

on:
  - push
  - pull_request

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: |
          uv venv --python 3.12
          uv pip install torch
          uv pip install torch_geometric
          uv sync --group dev

      - name: Run tests
        run: |
          uv run pytest