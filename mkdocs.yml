site_name: TorchStructure
repo_url: https://github.com/lazlo-bleker/torch-structure
theme:
  logo: assets/ts_arch_light.svg
  favicon: assets/ts_arch_light.svg
  name: material
  custom_dir: overrides
  language: en
  features:
    - content.code.copy
    - navigation.indexes
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Lato
  icon:
    repo: fontawesome/brands/github
markdown_extensions:
  - attr_list
  - admonition
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Installation: install.md
  - Tutorials:
    - tutorials/index.md
    - Creating topologies: tutorials/topology.md
    - Modeling with patterns: tutorials/patterns.md
    - Plotting structures: tutorials/plotting.md
  - API Reference: reference/

plugins:
- search
- mkdocstrings:
    handlers:
      python:
        paths: [src]
- gen-files:
    scripts:
    - docs_scripts/gen_ref_pages.py
- literate-nav:
    nav_file: SUMMARY.md

extra_css:
  - stylesheets/extra.css
