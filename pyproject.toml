[project]
name = "torch-structure"
version = "0.2.0"
description = "A Python package for graph-based autodifferentiable structural design and engineering."
authors = [
    {name = "Lazlo Bleker"}
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "matplotlib>=3.9.0",
    "numpy",
    "packaging",
    "scipy>=1.13",
    "torch-geometric>=2.6.1",
]

[project.urls]
Documentation = "https://lazlo-bleker.github.io/torch-structure/"
Repository = "https://github.com/lazlo-bleker/torch-structure"

[dependency-groups]
dev = [
    "mkdocs-gen-files==0.6.1",
    "mkdocs-literate-nav==0.6.3",
    "mkdocs-material==9.8.1",
    "mkdocstrings[python]==1.0.8",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.4",
]

[build-system]
requires = ["uv_build>=0.8.14,<0.14.0"]
build-backend = "uv_build"

[tool.pytest]
minversion = "9.0.0"
strict = true
addopts = [
    "--doctest-modules",
]
testpaths = [
    "tests"
]
